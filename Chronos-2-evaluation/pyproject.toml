[project]
name = "mobility-baselines"
version = "0.1.0"
description = "Evaluation framework for mobility forecasting and transport demand prediction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "chronos-forecasting>=2.2.2",
    "h5py>=3.15.1",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tables>=3.10.2",
    "tensorboardx>=2.6.4",
    "workalendar>=17.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
